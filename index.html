<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- ============================================ -->
    <!-- PERFORMANCE OPTIMIZATIONS -->
    <!-- ============================================ -->
    
    <!-- DNS Prefetch & Preconnect for External Resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://lovable.dev" />
    
    <!-- Preload Critical Resources -->
    <!-- Note: Add actual font files if self-hosting for better performance -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
    
    <!-- Font Loading with font-display: swap to prevent FOIT -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    
    <!-- ============================================ -->
    <!-- SEO & META TAGS -->
    <!-- ============================================ -->
    
    <title>
      Ashray Wellness | Astrology, Tarot & Spiritual Guidance by Ashi Pawaiya Jain
    </title>
    <meta
      name="description"
      content="Discover your cosmic path with Ashray Wellness. Expert astrology consultations, tarot readings, numerology guidance, and Reiki healing by Ashi Pawaiya Jain. Book your spiritual consultation today."
    />

    <meta
      name="keywords"
      content="astrology, tarot reading, numerology, reiki healing, spiritual guidance, vedic astrology, horoscope, birth chart, wellness"
    />
    <meta name="theme-color" content="#6366f1" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ashraywellness.com" />
    <meta
      property="og:title"
      content="Ashray Wellness | Spiritual Guidance Through Stars & Intuition"
    />
    <meta
      property="og:description"
      content="Expert astrology, tarot, numerology & Reiki healing services. Personalized spiritual guidance for your life journey."
    />
    <meta
      property="og:image"
      content="https://lovable.dev/opengraph-image-p98pqg.png"

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://ashraywellness.com" />
    <meta name="twitter:site" content="@AshrayWellness" />
    <meta
      name="twitter:title"
      content="Ashray Wellness | Spiritual Guidance Through Stars & Intuition"
    />
    <meta
      name="twitter:description"
      content="Expert astrology, tarot, numerology & Reiki healing services. Personalized spiritual guidance for your life journey."

    <meta
      name="twitter:image"
      content="https://lovable.dev/opengraph-image-p98pqg.png"

    <!-- Canonical URL -->
    <link rel="canonical" href="https://ashraywellness.com" />
    
    <!-- ============================================ -->
    <!-- CRITICAL CSS - Inline for Fastest Render -->
    <!-- ============================================ -->
    <style>
      /* System font stack for instant text rendering */
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        line-height: 1.5;
      }
      
      * {
        box-sizing: border-box;
      }
      
      #root {
        min-height: 100vh;
        isolation: isolate;
      }
      
      /* Prevent layout shift during initial load */
      .loading-skeleton {
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: loading 1.5s ease-in-out infinite;
      }
      
      @keyframes loading {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      
      /* Prevent flash of unstyled content */
      .hide-until-load {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      
      .loaded .hide-until-load {
        opacity: 1;
      }
      
      /* Image loading optimization */
      img {
        max-width: 100%;
        height: auto;
        display: block;
      }
      
      /* Prevent cumulative layout shift for images */
      img[loading="lazy"] {
        min-height: 200px;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    
    <!-- Main Application Script (Module) -->
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Performance Monitoring (Optional - Add only if using analytics) -->
    <script>
      // Report Web Vitals to analytics
      if ('PerformanceObserver' in window) {
        // Largest Contentful Paint (LCP)
        new PerformanceObserver((list) => {
          const entries = list.getEntries();
          const lastEntry = entries[entries.length - 1];
          console.log('LCP:', lastEntry.renderTime || lastEntry.loadTime);
        }).observe({ type: 'largest-contentful-paint', buffered: true });
        
        // First Input Delay (FID)
        new PerformanceObserver((list) => {
          const entries = list.getEntries();
          entries.forEach((entry) => {
            console.log('FID:', entry.processingStart - entry.startTime);
          });
        }).observe({ type: 'first-input', buffered: true });
        
        // Cumulative Layout Shift (CLS)
        let clsValue = 0;
        new PerformanceObserver((list) => {
          for (const entry of list.getEntries()) {
            if (!entry.hadRecentInput) {
              clsValue += entry.value;
              console.log('CLS:', clsValue);
            }
          }
        }).observe({ type: 'layout-shift', buffered: true });
      }
    </script>
  </body>
</html>
